# =============================================================================
# ~/.tmux.conf
# Prefix: Ctrl+Space  (frees up Ctrl+a for emacs beginning-of-line in shell)
# Copy mode: vi keys  (only inside tmux's scrollback — shell stays emacs mode)
# =============================================================================

# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix          # Press prefix twice to send Ctrl+Space to shell

# -----------------------------------------------------------------------------
# Core Behaviour
# -----------------------------------------------------------------------------

set -sg escape-time 10            # Near-zero escape delay (default 500ms breaks emacs meta keys)
set -g focus-events on            # Let vim/emacs know when pane gains/loses focus
set -g base-index 1               # Start window numbering at 1 (keyboard-friendly)
setw -g pane-base-index 1         # Same for panes
set -g renumber-windows on        # Close window 2 of 1,2,3 → becomes 1,2 automatically
set -g history-limit 50000        # Large scrollback (default is only 2000)
set -g display-time 1500          # Status messages stay visible for 1.5s

# -----------------------------------------------------------------------------
# True-Color & Terminal
# Critical for oh-my-posh zen theme to render all colors correctly
# -----------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"   # Enable true-color (RGB) for xterm-compatible terms
set -as terminal-overrides ",*:RGB"       # Fallback RGB flag for other terminals

# -----------------------------------------------------------------------------
# Mouse
# -----------------------------------------------------------------------------

set -g mouse on                   # Click to select pane/window, scroll to enter copy mode

# -----------------------------------------------------------------------------
# Key Bindings — Splits & Windows
# -----------------------------------------------------------------------------

# Reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display "  Config reloaded!"

# Intuitive split keys (open in current pane's directory)
bind | split-window -h -c "#{pane_current_path}"   # prefix + |  →  vertical split (side by side)
bind - split-window -v -c "#{pane_current_path}"   # prefix + -  →  horizontal split (top/bottom)
unbind '"'                                          # Remove old horizontal split
unbind %                                            # Remove old vertical split

# New window opens in current directory
bind c new-window -c "#{pane_current_path}"

# Window navigation (repeatable — hold prefix and tap n/p)
bind -r n next-window
bind -r p previous-window

# Reorder windows with < and >
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# -----------------------------------------------------------------------------
# Key Bindings — Pane Navigation (vim-style)
# prefix + h/j/k/l to move between panes
# -----------------------------------------------------------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Zoom/unzoom current pane (full-screen toggle)
bind z resize-pane -Z             # Same as default prefix+z, just making it explicit

# -----------------------------------------------------------------------------
# Key Bindings — Pane Resizing
# prefix + H/J/K/L  (capital, repeatable — hold prefix and tap)
# -----------------------------------------------------------------------------

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------------------------------------------------------
# Copy Mode  (vi keys inside tmux scrollback only)
#
# Your shell (zsh) keeps emacs mode (bindkey -e) at all times.
# Copy mode only activates when you scroll up into tmux's history buffer.
#
# How to use:
#   prefix + [          →  enter copy mode (scroll up through output)
#   prefix + Escape     →  also enter copy mode
#   q                   →  exit copy mode
#   /                   →  search forward   (like vim)
#   ?                   →  search backward
#   v                   →  begin selection
#   V                   →  select whole line
#   Ctrl+v              →  rectangle selection
#   y                   →  yank (copy) selection  →  goes to system clipboard via tmux-yank
#   Ctrl+u / Ctrl+d     →  half-page up/down
# -----------------------------------------------------------------------------

setw -g mode-keys vi

bind Escape copy-mode             # Extra entry point for copy mode

bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi V     send -X select-line
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-selection-and-cancel   # tmux-yank extends this to clipboard
bind -T copy-mode-vi C-u   send -X halfpage-up
bind -T copy-mode-vi C-d   send -X halfpage-down

# -----------------------------------------------------------------------------
# Status Bar
# Minimal and muted — palette mirrors oh-my-posh zen.toml:
#   blue    #89b4fa  (path segment)
#   magenta #cba6f7  (prompt ❯ and git branch)
#   yellow  #f9e2af  (execution time)
#   grey    #6c7086  (inactive / decorative)
#   surface #313244  (borders)
# bg=default means the terminal's own background shows through
# -----------------------------------------------------------------------------

set -g status-position bottom
set -g status-style "bg=default,fg=#6c7086"
set -g status-interval 1

# Left side: session name in magenta (matches ❯ prompt color)
set -g status-left " #[fg=#cba6f7,bold]#S#[default] "
set -g status-left-length 30

# Right side: date + time in yellow (matches execution-time segment)
set -g status-right "#[fg=#f9e2af] %d %b  %H:%M#[default] "
set -g status-right-length 40

# Window list centered
set -g status-justify centre

# Inactive windows: muted grey
setw -g window-status-format         " #[fg=#6c7086]#I:#W#[default] "

# Active window: blue + bold (matches path color in zen theme)
setw -g window-status-current-format " #[fg=#89b4fa,bold]#I:#W#[default] "

# Pane borders: subtle surface color, active pane in blue
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message bar (e.g. "Config reloaded!") in magenta
set -g message-style "bg=default,fg=#cba6f7,bold"

# -----------------------------------------------------------------------------
# Plugins (TPM — Tmux Plugin Manager)
#
# Setup (one-time):
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# Install plugins:  prefix + I
# Update plugins:   prefix + U
# Remove unused:    prefix + alt + u
# -----------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # Sensible defaults (overrides some settings above with good values)

# tmux-yank: y in copy mode copies to system clipboard (macOS pbcopy / Linux xclip)
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-resurrect: manually save/restore sessions across reboots
#   Save:    prefix + Ctrl+s
#   Restore: prefix + Ctrl+r
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'  # Also save what's displayed in each pane

# tmux-continuum: automatic session saving (builds on resurrect)
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'               # Auto-restore last save when tmux server starts
set -g @continuum-save-interval '15'         # Auto-save every 15 minutes

# Keep this line at the very bottom of .tmux.conf
run '~/.tmux/plugins/tpm/tpm'
